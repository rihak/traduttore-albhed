<!--
  TRADUTTORE AL BHED ↔ ITALIANO
  PWA a file singolo, offline, zero dipendenze. Safari > Condividi > Aggiungi a Home.

  COS'È L'AL BHED
  Lingua cifrata parlata dalla tribù Al Bhed in Final Fantasy X. Non è una lingua
  vera: è una sostituzione monoalfabetica applicata all'alfabeto latino. Nella
  localizzazione italiana del gioco la mappa è quella in ALBHED_TO_IT più sotto.
  Progetto fan-made, non ufficiale, non affiliato a Square Enix.

  ARCHITETTURA
  Un solo file, tre blocchi: il foglio di stile (tutto il CSS), il markup, e il
  blocco script con tutta la logica in una IIFE, così nulla finisce su window.
  Nessun build step, nessuna CDN: si apre anche con doppio click da filesystem.

  MODELLO DATI (localStorage, chiave 'albhed-saved-translations')
  Array di voci, ordinato per ts decrescente (più recenti in cima):
    { id: string, direction: 'a2i'|'i2a', source: string, target: string, ts: number }
  - id: identificatore opaco, usato per delete e per deduplicare in import
  - direction: verso della traduzione al momento del salvataggio, serve a
    ripristinare l'orientamento giusto quando si ricarica una voce
  - source/target: testo così come digitato/tradotto (non trimmato, per fedeltà)
  - ts: epoch ms, unica fonte dell'ordinamento

  ICONE
  Pre-renderizzate come PNG in base64 nei link qui sotto. NON generate a runtime
  da un'emoji su canvas: il rendering dei glifi emoji a colori dentro canvas non è
  affidabile (su iOS cade su un fallback monocromatico quasi invisibile su sfondo
  chiaro). La chiave è disegnata a vettore, sfondo crema perché il glifo è a tinte
  brass scure e su fondo scuro sparirebbe.
-->

  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    /* Due aloni radiali agli angoli opposti: danno profondità senza immagini */
    background:
      radial-gradient(circle at 12% -8%, rgba(79,184,172,.12), transparent 42%),
      radial-gradient(circle at 92% 108%, rgba(201,154,91,.10), transparent 46%),
      var(--ink);
    color:var(--parchment);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    /* Il max() garantisce spazio sotto il notch/Dynamic Island: su device senza notch
       env() vale 0 e resta il valore fisso, su iPhone 15 Pro cresce quanto serve.
       Tenuto basso di proposito per non introdurre scroll nella vista iniziale. */
    padding: max(48px, calc(env(safe-area-inset-top) + 14px)) 20px 40px;
  }

  /* ---------- Layout ---------- */
  .app{
    max-width:560px;
    margin:0 auto;
    animation: riseIn .6s ease both;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .hero{ text-align:center; margin-bottom:36px; }

  /* Qui l'emoji è renderizzata dal browser nel flusso del testo, dove funziona
     correttamente (a differenza del canvas: vedi nota sulle icone in testa al file) */
  .hero-icon{
    font-size:2.8rem;
    filter: drop-shadow(0 6px 14px rgba(201,154,91,.35));
    margin-bottom:6px;
  }

  h1{
    font-family: Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif;
    font-size:clamp(1.7rem, 5vw, 2.4rem);
    font-weight:600;
    letter-spacing:-.01em;
    margin:0 0 10px;
  }

  .subtitle{
    color:var(--slate);
    font-size:1rem;
    max-width:38ch;
    margin:0 auto;
    line-height:1.5;
  }

  /* position:relative crea il contesto per lo z-index del pulsante di swap,
     che va sovrapposto al bordo dei due pannelli */
  .panel-stack{ position:relative; }

  .panel{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:var(--radius-lg);
    padding:20px 20px 22px;
    box-shadow: 0 24px 60px -28px rgba(0,0,0,.6);
  }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }

  .panel-head h2{
    font-size:.95rem;
    font-weight:600;
    color:var(--brass);
    letter-spacing:.02em;
    margin:0;
  }

  /* ---------- Controlli ---------- */
  .icon-btn{
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.05);
    color:var(--slate);
    font-size:.95rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, color .2s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.1); color:var(--parchment); }
  .icon-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  /* .flash: stato temporaneo di conferma (spunta verde) applicato da flashButton() */
  .icon-btn.flash{ color:var(--teal); }
  .icon-btn:disabled{ opacity:.35; pointer-events:none; }

  .panel-actions{ display:flex; gap:6px; }

  .text-btn{
    background:none; border:none;
    color:var(--teal);
    font-size:.95rem;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:background .2s;
  }
  .text-btn:hover{ background:rgba(79,184,172,.09); }
  .text-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .text-btn:disabled{ opacity:.4; pointer-events:none; }

  /* overflow:hidden + resize:none perché l'altezza è gestita da autoGrow() in JS:
     i due textarea crescono col contenuto invece di mostrare una scrollbar interna */
  textarea{
    width:100%;
    min-height:120px;
    resize:none;
    overflow:hidden;
    background:rgba(0,0,0,.18);
    border:1px solid transparent;
    border-radius:var(--radius-md);
    padding:14px 16px;
    color:var(--parchment);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
    font-size:1.05rem;
    line-height:1.55;
    outline:none;
    transition:border-color .2s;
  }
  textarea::placeholder{ color:var(--slate); opacity:.75; }
  textarea:focus-visible{ border-color:var(--teal); }
  /* Sfondo verderame per distinguere a colpo d'occhio l'output dall'input */
  #outputText{ background:rgba(79,184,172,.07); }

  /* Il margine negativo fa "mordere" il pulsante sui pannelli sopra e sotto;
     il bordo del colore del fondo pagina simula un ritaglio */
  .swap-dial{
    width:56px; height:56px;
    margin:-20px auto;
    position:relative; z-index:2;
    border-radius:50%;
    border:4px solid var(--ink);
    background:linear-gradient(135deg,var(--brass),var(--teal));
    color:var(--ink);
    font-size:1.35rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 22px -4px rgba(0,0,0,.5);
  }
  .swap-dial.spin{ animation: spinOnce .5s ease; }
  @keyframes spinOnce{ from{ transform:rotate(0deg); } to{ transform:rotate(180deg); } }
  .swap-dial:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }

  /* ---------- Cifrario ---------- */
  .cipher-toggle-wrap{ text-align:center; margin-top:28px; }

  /* display:grid solo su :not([hidden]): a parità di specificità una regola
     dell'autore batte [hidden]{display:none} dell'user-agent, quindi un
     `display:grid` secco renderebbe l'attributo hidden inefficace */
  .cipher-grid{
    margin-top:16px;
    grid-template-columns:repeat(auto-fill, minmax(84px,1fr));
    gap:8px;
  }
  .cipher-grid:not([hidden]){ display:grid; }

  .cipher-cell{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:8px 6px;
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-size:.85rem;
  }
  .cipher-cell .arrow{ color:var(--slate); font-size:.75rem; }

  .foot-note{
    text-align:center;
    color:var(--slate);
    font-size:.8rem;
    margin-top:36px;
  }

  /* ---------- Archivio traduzioni: pulsante flottante ---------- */
  /* position:fixed con max(…, env()) per non finire sotto il notch in landscape */
  .saved-fab{
    position:fixed;
    top:max(16px, env(safe-area-inset-top));
    right:max(16px, env(safe-area-inset-right));
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--brass);
    font-size:1.25rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
    z-index:40;
  }
  .saved-fab:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }

  /* Contatore voci salvate, ancorato al FAB (che è il positioned ancestor) */
  .badge{
    position:absolute;
    top:-4px; right:-4px;
    min-width:18px; height:18px;
    padding:0 4px;
    border-radius:9px;
    background:var(--teal);
    color:var(--ink);
    font-size:.65rem;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Archivio traduzioni: drawer ----------
     Apertura in due fasi (hidden rimosso, poi classe .show al frame successivo)
     perché una transition non parte su un elemento appena passato da display:none */
  .drawer-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:60;
    opacity:0;
    transition:opacity .25s ease;
  }
  .drawer-overlay.show{ opacity:1; }

  .drawer{
    position:fixed; top:0; right:0;
    height:100%;
    width:min(380px, 92vw);
    background:var(--panel);
    border-left:1px solid var(--panel-line);
    box-shadow:-24px 0 60px -20px rgba(0,0,0,.6);
    z-index:61;
    padding:22px 18px;
    padding-top:max(22px, env(safe-area-inset-top));
    overflow-y:auto;
    transform:translateX(100%);
    transition:transform .3s ease;
  }
  .drawer.show{ transform:translateX(0); }

  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .drawer-head h2{
    font-family: Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0;
  }

  .drawer-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--panel-line);
  }
  .drawer-toolbar .text-btn{
    flex:1;
    background:rgba(255,255,255,.04);
    font-size:.85rem;
  }

  .saved-empty{
    color:var(--slate);
    font-size:.9rem;
    text-align:center;
    margin-top:48px;
  }

  .saved-item{
    background:rgba(0,0,0,.16);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .saved-item-dir{
    font-size:.72rem;
    font-weight:600;
    color:var(--brass);
    margin-bottom:7px;
  }
  /* word-break perché una stringa cifrata lunga senza spazi sfonderebbe il drawer */
  .saved-item-text{
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-size:.88rem;
    line-height:1.45;
    word-break:break-word;
  }
  .saved-item-source{ color:var(--parchment); margin-bottom:4px; }
  .saved-item-target{ color:var(--teal); margin-bottom:10px; }
  .saved-item-actions{
    display:flex; align-items:center; justify-content:flex-end; gap:6px;
  }
  .load-btn{ font-size:.85rem; padding:5px 12px; }
  .delete-btn{ width:28px; height:28px; font-size:.85rem; }
  .delete-btn:hover{ background:rgba(217,105,90,.12); color:var(--danger); }

  /* ---------- Accessibilità ---------- */
  /* Etichette per screen reader, rimosse dal flusso visivo */
  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:420px){
    body{ padding: max(36px, calc(env(safe-area-inset-top) + 14px)) 14px 32px; }
    h1{ font-size:1.55rem; }
    .panel{ padding:16px 16px 18px; }
    textarea{ font-size:1rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .app{ animation:none; }
    .swap-dial.spin{ animation:none; }
    .drawer, .drawer-overlay{ transition:none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="hero-icon" aria-hidden="true">🗝️</div>
    <h1>Traduttore Al Bhed</h1>
    <p class="subtitle">Decifra il linguaggio degli Al Bhed, lettera per lettera.</p>
  </header>

  <main class="panel-stack">
    <!-- Pannello di input. Le etichette h2 sono riscritte da updateLabels() a ogni swap. -->
    <section class="panel">
      <div class="panel-head">
        <h2 id="sourceLabel">Al Bhed</h2>
        <button class="icon-btn" id="clearBtn" aria-label="Cancella il testo">✕</button>
      </div>
      <label class="sr-only" for="inputText">Testo da tradurre</label>
      <!-- autocapitalize/autocorrect off: su mobile altrimenti il testo cifrato viene "corretto" -->
      <textarea id="inputText" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    </section>

    <button id="swapBtn" class="swap-dial" aria-label="Inverti la direzione della traduzione" title="Inverti direzione">⇅</button>

    <!-- Pannello di output: readonly, popolato solo da JS -->
    <section class="panel">
      <div class="panel-head">
        <h2 id="targetLabel">Italiano</h2>
        <div class="panel-actions">
          <!-- disabled iniziale: senza testo non c'è nulla da salvare -->
          <button class="icon-btn" id="saveBtn" aria-label="Salva questa traduzione" title="Salva" disabled>💾</button>
          <button class="icon-btn" id="copyBtn" aria-label="Copia il testo tradotto" title="Copia">⧉</button>
        </div>
      </div>
      <label class="sr-only" for="outputText">Traduzione</label>
      <textarea id="outputText" spellcheck="false" readonly aria-live="polite"></textarea>
    </section>
  </main>

  <!-- Tabella del cifrario, costruita al primo click e poi solo mostrata/nascosta -->
  <div class="cipher-toggle-wrap">
    <button id="cipherToggle" class="text-btn" aria-expanded="false">Mostra il cifrario</button>
    <div id="cipherGrid" class="cipher-grid" hidden></div>
  </div>

  <footer class="foot-note">
    <p>Funziona interamente offline, sul tuo dispositivo.</p>
  </footer>
</div>

<!-- Archivio: FAB sempre visibile + drawer laterale -->
<button id="savedToggle" class="saved-fab" aria-haspopup="true" aria-expanded="false" aria-controls="savedDrawer" title="Traduzioni salvate">
  🗂️<span id="savedBadge" class="badge" hidden>0</span>
</button>

<div id="savedOverlay" class="drawer-overlay" hidden></div>
<aside id="savedDrawer" class="drawer" hidden aria-label="Traduzioni salvate">
  <div class="drawer-head">
    <h2>Traduzioni salvate</h2>
    <button id="savedClose" class="icon-btn" aria-label="Chiudi">✕</button>
  </div>
  <div class="drawer-toolbar">
    <button id="exportBtn" class="text-btn" disabled>📤 Esporta</button>
    <button id="importBtn" class="text-btn">📥 Importa</button>
    <!-- input file nascosto: il click arriva dal pulsante Importa -->
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div id="savedList"></div>
</aside>

<script>
// IIFE: nessuna variabile finisce su window, così l'app resta incapsulata
(() => {
  'use strict';

  // ============================================================
  // 1. CIFRARIO
  // ============================================================

  /* Mappa Al Bhed -> Italiano della localizzazione italiana di FFX.
     È l'unica fonte di verità: la mappa inversa e la tabella mostrata
     nell'interfaccia sono entrambe derivate da qui. */
  const ALBHED_TO_IT = {
    A:'E', B:'P', C:'S', D:'T', E:'I', F:'W', G:'K', H:'N', I:'U',
    J:'V', K:'G', L:'C', M:'L', N:'R', O:'Y', P:'B', Q:'X', R:'H',
    S:'M', T:'D', U:'O', V:'F', W:'Z', X:'Q', Y:'A', Z:'J'
  };

  /* La sostituzione è biunivoca (permutazione dell'alfabeto), quindi invertire
     le coppie chiave/valore basta a ottenere il verso opposto. */
  const IT_TO_ALBHED = Object.fromEntries(
    Object.entries(ALBHED_TO_IT).map(([albhed, italiano]) => [italiano, albhed])
  );

  // Verso corrente: 'a2i' = Al Bhed -> Italiano, 'i2a' = Italiano -> Al Bhed
  let direction = 'a2i';

  const currentMap = () => (direction === 'a2i' ? ALBHED_TO_IT : IT_TO_ALBHED);

  /* Traduce preservando maiuscole/minuscole e lasciando intatto tutto ciò che
     non è A-Z: spazi, punteggiatura, cifre e lettere accentate (à, è, ù…).
     Le accentate passano invariate di proposito: il cifrario del gioco copre
     solo l'alfabeto latino base, non esiste una controparte cifrata per "è". */
  const translate = (text) => text.replace(/[A-Za-z]/g, (ch) => {
    const upper = ch.toUpperCase();
    const isLower = ch !== upper;
    const out = currentMap()[upper];
    return isLower ? out.toLowerCase() : out;
  });

  // ============================================================
  // 2. RIFERIMENTI AL DOM
  // ============================================================

  const inputText   = document.getElementById('inputText');
  const outputText  = document.getElementById('outputText');
  const sourceLabel = document.getElementById('sourceLabel');
  const targetLabel = document.getElementById('targetLabel');
  const swapBtn     = document.getElementById('swapBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const copyBtn     = document.getElementById('copyBtn');
  const saveBtn     = document.getElementById('saveBtn');
  const cipherToggle = document.getElementById('cipherToggle');
  const cipherGrid   = document.getElementById('cipherGrid');
  // Archivio
  const savedToggle  = document.getElementById('savedToggle');
  const savedBadge   = document.getElementById('savedBadge');
  const savedOverlay = document.getElementById('savedOverlay');
  const savedDrawer  = document.getElementById('savedDrawer');
  const savedClose   = document.getElementById('savedClose');
  const savedList    = document.getElementById('savedList');
  const exportBtn    = document.getElementById('exportBtn');
  const importBtn    = document.getElementById('importBtn');
  const importFile   = document.getElementById('importFile');

  // ============================================================
  // 3. UTILITY UI
  // ============================================================

  /* Adatta l'altezza del textarea al contenuto. Il reset a 'auto' è necessario:
     scrollHeight non decresce mai se l'altezza esplicita è già maggiore. */
  const autoGrow = (el) => {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  };

  /* Feedback temporaneo su un pulsante (conferma o errore).
     Salva l'etichetta originale in un data attribute e annulla il timer
     precedente, così click ravvicinati non "congelano" il testo di conferma
     come se fosse l'originale. */
  const flashButton = (btn, label, isError = false) => {
    if (btn.dataset.flashTimer) {
      clearTimeout(Number(btn.dataset.flashTimer));
    } else {
      btn.dataset.flashLabel = btn.textContent;
    }
    btn.textContent = label;
    btn.classList.toggle('flash', !isError);
    btn.style.color = isError ? 'var(--danger)' : '';
    const timer = setTimeout(() => {
      btn.textContent = btn.dataset.flashLabel;
      btn.classList.remove('flash');
      btn.style.color = '';
      delete btn.dataset.flashTimer;
      delete btn.dataset.flashLabel;
    }, isError ? 1800 : 1200);
    btn.dataset.flashTimer = String(timer);
  };

  // Escape per l'interpolazione in innerHTML: il testo salvato è arbitrario
  // (e in import proviene da un file esterno), quindi va sempre neutralizzato
  const escapeHtml = (str) => String(str).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));

  const DIRECTION_LABELS = {
    a2i: { source: 'Al Bhed', target: 'Italiano' },
    i2a: { source: 'Italiano', target: 'Al Bhed' }
  };

  // Allinea etichette e placeholder al verso corrente
  const updateLabels = () => {
    const { source, target } = DIRECTION_LABELS[direction];
    sourceLabel.textContent = source;
    targetLabel.textContent = target;
    inputText.placeholder = `Scrivi qui in ${source}...`;
    outputText.placeholder = `La traduzione in ${target} apparirà qui...`;
  };

  /* Unico punto da cui passa ogni aggiornamento del traduttore: ritraduce,
     riadatta le altezze e sincronizza lo stato del pulsante Salva.
     Chiamare sempre questa invece di toccare outputText a mano. */
  const refreshTranslation = () => {
    outputText.value = translate(inputText.value);
    autoGrow(inputText);
    autoGrow(outputText);
    saveBtn.disabled = !inputText.value.trim();
  };

  // ============================================================
  // 4. TRADUTTORE: EVENTI
  // ============================================================

  inputText.addEventListener('input', refreshTranslation);

  /* Swap: inverte il verso e promuove l'output a nuovo input, così premendolo
     due volte si torna esattamente al punto di partenza. */
  swapBtn.addEventListener('click', () => {
    direction = direction === 'a2i' ? 'i2a' : 'a2i';
    updateLabels();
    inputText.value = outputText.value;
    refreshTranslation();
    // remove + reflow + add: ri-innesca l'animazione anche a click ripetuti
    swapBtn.classList.remove('spin');
    void swapBtn.offsetWidth;
    swapBtn.classList.add('spin');
  });

  clearBtn.addEventListener('click', () => {
    inputText.value = '';
    refreshTranslation();
    inputText.focus();
  });

  /* Copia con fallback: navigator.clipboard richiede contesto sicuro
     (https o localhost) e non è disponibile aprendo il file da disco. */
  copyBtn.addEventListener('click', async () => {
    if (!outputText.value) return;
    try {
      await navigator.clipboard.writeText(outputText.value);
    } catch (err) {
      // execCommand è deprecato ma resta l'unica via senza Clipboard API.
      // Il readonly va rimosso temporaneamente perché su iOS blocca select().
      outputText.removeAttribute('readonly');
      outputText.select();
      document.execCommand('copy');
      outputText.setAttribute('readonly', '');
    }
    flashButton(copyBtn, '✓');
  });

  // ============================================================
  // 5. TABELLA DEL CIFRARIO
  // ============================================================

  cipherToggle.addEventListener('click', () => {
    const wasExpanded = cipherToggle.getAttribute('aria-expanded') === 'true';
    cipherToggle.setAttribute('aria-expanded', String(!wasExpanded));
    cipherToggle.textContent = wasExpanded ? 'Mostra il cifrario' : 'Nascondi il cifrario';
    cipherGrid.hidden = wasExpanded;

    // Costruzione lazy e una volta sola: la tabella è statica
    if (!wasExpanded && !cipherGrid.dataset.built) {
      cipherGrid.innerHTML = Object.entries(ALBHED_TO_IT)
        .map(([albhed, italiano]) =>
          `<div class="cipher-cell"><span>${albhed}</span><span class="arrow">&rarr;</span><span>${italiano}</span></div>`)
        .join('');
      cipherGrid.dataset.built = '1';
    }
  });

  // ============================================================
  // 6. ARCHIVIO: PERSISTENZA
  // ============================================================

  const STORAGE_KEY = 'albhed-saved-translations';
  // Prefisso condiviso da nome file di export e (per coerenza) dal nome repo
  const APP_SLUG = 'traduttore-albhed';

  /* Lettura difensiva: localStorage può essere disabilitato (Safari privato,
     policy aziendali) o contenere JSON corrotto da una versione precedente.
     In entrambi i casi si degrada a lista vuota invece di rompere l'app. */
  const loadSaved = () => {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  };

  /* Scrittura con ordinamento forzato: l'invariante "ts decrescente" è imposta
     qui e in nessun altro punto, così chiamanti diversi (salvataggio singolo,
     import in blocco) non possono introdurre ordini divergenti. */
  const persistSaved = (list) => {
    const ordered = list.slice().sort((a, b) => b.ts - a.ts);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ordered));
    } catch (err) {
      // Tipicamente quota superata: l'utente deve esportare ed eliminare voci
      flashButton(saveBtn, '✕', true);
    }
    return ordered;
  };

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ============================================================
  // 7. ARCHIVIO: RENDER
  // ============================================================

  /* Badge del FAB + abilitazione dell'export: entrambi dipendono solo dal
     numero di voci, quindi si aggiornano insieme dopo ogni mutazione. */
  const updateSavedIndicators = () => {
    const count = loadSaved().length;
    savedBadge.hidden = count === 0;
    savedBadge.textContent = count > 99 ? '99+' : String(count);
    exportBtn.disabled = count === 0;
  };

  /* La lista viene ridisegnata interamente a ogni mutazione. Con volumi da uso
     personale (decine/centinaia di voci) è più semplice e sicuro di un update
     incrementale; i click sono gestiti da un solo listener delegato. */
  const renderSavedList = () => {
    const list = loadSaved();
    if (!list.length) {
      savedList.innerHTML = '<p class="saved-empty">Nessuna traduzione salvata.</p>';
      return;
    }
    savedList.innerHTML = list.map((item) => {
      const dirLabel = item.direction === 'a2i'
        ? 'Al Bhed &rarr; Italiano'
        : 'Italiano &rarr; Al Bhed';
      return `
        <div class="saved-item">
          <div class="saved-item-dir">${dirLabel}</div>
          <div class="saved-item-text saved-item-source">${escapeHtml(item.source)}</div>
          <div class="saved-item-text saved-item-target">${escapeHtml(item.target)}</div>
          <div class="saved-item-actions">
            <button class="text-btn load-btn" data-action="load" data-id="${escapeHtml(item.id)}">Carica</button>
            <button class="icon-btn delete-btn" data-action="delete" data-id="${escapeHtml(item.id)}" aria-label="Elimina questa traduzione">🗑</button>
          </div>
        </div>`;
    }).join('');
  };

  // Da chiamare dopo ogni scrittura su localStorage
  const refreshSavedUI = () => {
    updateSavedIndicators();
    renderSavedList();
  };

  // ============================================================
  // 8. ARCHIVIO: DRAWER
  // ============================================================

  const onDrawerKeyDown = (e) => { if (e.key === 'Escape') closeDrawer(); };

  /* Dichiarate come function (non const): l'hoisting permette a
     onDrawerKeyDown, definita sopra, di riferirsi a closeDrawer. */
  function openDrawer() {
    savedOverlay.hidden = false;
    savedDrawer.hidden = false;
    // Le classi .show vanno applicate al frame dopo la rimozione di hidden,
    // altrimenti il browser non ha uno stato iniziale da cui animare
    requestAnimationFrame(() => {
      savedOverlay.classList.add('show');
      savedDrawer.classList.add('show');
    });
    savedToggle.setAttribute('aria-expanded', 'true');
    renderSavedList();
    document.addEventListener('keydown', onDrawerKeyDown);
  }

  function closeDrawer() {
    savedOverlay.classList.remove('show');
    savedDrawer.classList.remove('show');
    savedToggle.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onDrawerKeyDown);
    // hidden rimesso solo a transizione conclusa (durata allineata al CSS: .3s)
    setTimeout(() => {
      savedOverlay.hidden = true;
      savedDrawer.hidden = true;
    }, 300);
  }

  savedToggle.addEventListener('click', () => {
    if (savedToggle.getAttribute('aria-expanded') === 'true') closeDrawer();
    else openDrawer();
  });
  savedOverlay.addEventListener('click', closeDrawer);
  savedClose.addEventListener('click', closeDrawer);

  // ============================================================
  // 9. ARCHIVIO: SALVA / CARICA / ELIMINA
  // ============================================================

  saveBtn.addEventListener('click', () => {
    if (!inputText.value.trim()) return;
    const list = loadSaved();
    list.push({
      id: newId(),
      direction,
      // Salvati non trimmati: il testo va conservato come digitato
      source: inputText.value,
      target: outputText.value,
      ts: Date.now()
    });
    persistSaved(list); // l'ordinamento newest-first lo impone persistSaved
    updateSavedIndicators();
    // La lista si ridisegna all'apertura del drawer, qui basta il badge
    flashButton(saveBtn, '✓');
  });

  /* Listener delegato: un solo handler per tutti i pulsanti della lista,
     che continua a funzionare dopo ogni re-render. */
  savedList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const { id, action } = btn.dataset;
    const list = loadSaved();

    if (action === 'load') {
      const item = list.find((i) => i.id === id);
      if (!item) return;
      // Ripristina anche il verso, altrimenti il testo verrebbe ritradotto
      // col cifrario sbagliato al primo input
      direction = item.direction;
      updateLabels();
      inputText.value = item.source;
      refreshTranslation();
      closeDrawer();
      inputText.focus();

    } else if (action === 'delete') {
      persistSaved(list.filter((i) => i.id !== id));
      refreshSavedUI();
    }
  });

  // ============================================================
  // 10. ARCHIVIO: EXPORT / IMPORT
  // ============================================================
  // localStorage è per-dispositivo e per-browser: Firefox Sync e iCloud non
  // sincronizzano lo storage dei siti. Export/import su file JSON è quindi
  // il modo per spostare la cronologia tra dispositivi.

  exportBtn.addEventListener('click', () => {
    const list = loadSaved();
    if (!list.length) return;
    const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // Nome allineato allo slug dell'app: traduttore-albhed-YYYY-MM-DD.json
    a.download = `${APP_SLUG}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    // Reset immediato del value: senza questo, riselezionare lo stesso file
    // non genera un nuovo evento change
    e.target.value = '';
    if (!file) return;

    try {
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed)) throw new Error('struttura non valida');

      const existing = loadSaved();
      const knownIds = new Set(existing.map((i) => i.id));
      const merged = existing.slice();
      let added = 0;
      let skipped = 0;

      /* Merge additivo e idempotente: importare non cancella quanto già presente,
         e una voce il cui id è già in archivio viene saltata. Questo rende
         innocuo reimportare due volte lo stesso file.
         Nota: la dedup è per id, non per contenuto: due voci con testo identico
         ma id diversi restano entrambe (scelta voluta, sono salvataggi distinti). */
      parsed.forEach((raw) => {
        // Validazione minima: scarta le voci senza i due campi indispensabili
        if (!raw || typeof raw.source !== 'string' || typeof raw.target !== 'string') return;

        // Un id assente viene generato; un id già noto significa voce già presente
        const id = (typeof raw.id === 'string' && raw.id) ? raw.id : newId();
        if (knownIds.has(id)) { skipped++; return; }
        knownIds.add(id);

        merged.push({
          id,
          // Normalizzazione dei campi opzionali: un file manipolato a mano
          // non deve poter inserire valori fuori dominio nel modello
          direction: raw.direction === 'i2a' ? 'i2a' : 'a2i',
          source: raw.source,
          target: raw.target,
          ts: typeof raw.ts === 'number' ? raw.ts : Date.now()
        });
        added++;
      });

      persistSaved(merged);
      refreshSavedUI();
      // Distinguo i due esiti: "0 nuove" da solo sembrerebbe un errore
      flashButton(importBtn, added ? `✓ ${added} importate` : `✓ già presenti`);
    } catch (err) {
      flashButton(importBtn, '✕ File non valido', true);
    }
  });

  // ============================================================
  // 11. MANIFEST PWA
  // ============================================================
  // Costruito a runtime e servito come blob URL per non ripetere i base64
  // delle icone (già presenti nei <link> dell'head) dentro il file.
  // Nota: Safari ignora il manifest per "Aggiungi a Home" e usa i meta
